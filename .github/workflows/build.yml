name: 'Design System Build'

on:
  push:

permissions:
  id-token: write
  # To be able to push to the repo
  contents: write
  # To update the pr description with canary info
  pull-requests: write
  # For pr-check to create a status
  statuses: write
  # Needed to create PR statuses/checks
  checks: write
  # To post comments on PRs
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install pnpm
        uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26.x
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'
      - uses: ./.github/workflows/actions/build-all
        name: Build

  test-core-spec:
    needs: [ build ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install pnpm
        uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26.x
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'
      - uses: ./.github/workflows/actions/test-core-spec
        name: Test Core Spec

  release-packages:
    if: "!contains(github.event.head_commit.message, 'ci skip') && !contains(github.event.head_commit.message, 'skip ci')"
    needs: [test-core-spec,build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install pnpm
        uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26.x
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'
      - uses: ./.github/workflows/actions/release-packages
        name: Release Packages
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
